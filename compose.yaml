# PostgreSQL local para testar o modo web. Não é usado pelo aplicativo desktop.
# Suba com `npm run db:up` e derrube com `npm run db:down` (os dados ficam no
# volume nomeado). Para usar outro banco, defina CRM_POSTGRES_URL antes de
# `npm run dev:postgres`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  crm-postgres-data:
